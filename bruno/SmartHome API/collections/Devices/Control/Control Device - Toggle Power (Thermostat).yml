info:
  name: Control Device - Toggle Power (Thermostat)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/Devices/f21cfc72-c982-44d0-8d6e-4706451d06b5/commands"
  body:
    type: json
    data: |-
      {
        "command": "TogglePower"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Verifies that valid control commands are accepted and applied to a device.
