info:
  name: Control Device - Set Color (Valid)
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/Devices/5589731f-a375-4692-8680-0684c13f3e9d/commands"
  body:
    type: json
    data: |-
      {
        "command": "SetColor",
        "color": "#FF8800"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Verifies that valid control commands are accepted and applied to a device.
