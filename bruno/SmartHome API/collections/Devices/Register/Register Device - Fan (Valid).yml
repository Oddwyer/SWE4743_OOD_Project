info:
  name: Register Device - Fan (Valid)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/Devices/"
  body:
    type: json
    data: |-
      {
        "deviceName": "Master Bedroom Thermostat",
        "deviceLocation": "Master Bedroom",
        "type": "Thermostat"
      }
  auth: inherit

settings:
