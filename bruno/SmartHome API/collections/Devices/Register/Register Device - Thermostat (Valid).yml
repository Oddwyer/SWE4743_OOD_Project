info:
  name: Register Device - Thermostat (Valid)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/Devices/"
  body:
    type: json
    data: |-
      {
        "deviceName": "Garage Door Lock",
        "deviceLocation": "Kitchen",
        "type": "Door Lock"
