<!-- =========================
     SIMULATION SETTINGS CARD
     ========================= -->

<p-card styleClass="simulation-card">
  <div class="simulation-card-header">
    <h2>Simulation Settings</h2>
  </div>

  <!-- Ambient Temperature Controls -->
  <div *ngFor="let location of locations" class="setting-row ambient-row">
    <span class="material-symbols-outlined simulation-icon">
      thermostat
    </span>

    <div class="simulation-control">
      <div class="simulation-header">
        <span class="simulation-label">
          {{ location }} Ambient Temperature:
        </span>
      </div>

      <div class="ambient-slider-row">
        <ng-container *ngIf="hasAmbientTemperature(location); else loadingSlider">
          <p-slider
            styleClass="ambient-slider"
            [ngModel]="getAmbientTemperature(location)"
            [min]="minTemp"
            [max]="maxTemp"
            (onSlideEnd)="setAmbientTemperature(location, $any($event).value)"
          ></p-slider>
        </ng-container>

        <ng-template #loadingSlider>
          <p-slider
            styleClass="ambient-slider"
            [ngModel]="minTemp"
            [min]="minTemp"
            [max]="maxTemp"
            [disabled]="true"
          ></p-slider>
        </ng-template>

        <span class="simulation-value">
          <ng-container *ngIf="hasAmbientTemperature(location); else loadingText">
            {{ getDisplayAmbientTemperature(location) }}°F
          </ng-container>

          <ng-template #loadingText>
            Loading...
          </ng-template>
        </span>
      </div>
    </div>
  </div>

  <!-- Simulation Speed Controls -->
  <div class="setting-row speed-row">
    <span class="material-symbols-outlined simulation-icon">
      speed
    </span>

    <div class="simulation-control">
      <div class="simulation-header">
        <span class="simulation-label">
          Simulation Speed:
        </span>
      </div>

      <div class="speed-button-group">
        <button
          *ngFor="let option of speedOptions"
          type="button"
          class="speed-button"
          [class.selected]="simulationSpeed === option.value"
          (click)="setSimulationSpeed(option.value)"
        >
          {{ option.label }}
        </button>
      </div>
    </div>
  </div>

  <!-- Reset Simulation -->
  <div class="setting-row">
    <span class="material-symbols-outlined simulation-icon">
      restart_alt
    </span>

    <div class="simulation-control">
      <div class="simulation-header">
        <span class="simulation-label">
          Reset Simulation:
        </span>
      </div>

      <button
        type="button"
        class="reset-button"
        (click)="resetSimulation()"
      >
        Reset Simulator
      </button>
    </div>
  </div>
</p-card>
