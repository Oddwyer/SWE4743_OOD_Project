<!-- Simulation controls. -->
<p-card styleClass="simulation-card">
  <div class="simulation-card-header">
    <h2>Simulation Settings</h2>
  </div>

  <!-- Ambient temperature controls -->
  <div *ngFor="let location of locations" class="setting-row ambient-row">
    <span class="material-symbols-outlined simulation-icon">thermostat</span>

    <div class="simulation-control">
      <div class="simulation-header">
        <span class="simulation-label">{{ location }} Ambient Temperature:</span>
      </div>

      <div class="ambient-slider-row">
        <ng-container *ngIf="hasAmbientTemperature(location); else loadingSlider">
          <p-slider styleClass="ambient-slider" [ngModel]="getAmbientTemperature(location)" [min]="minTemp"
            [max]="maxTemp" (onSlideEnd)="setAmbientTemperature(location, $any($event).value)"></p-slider>
        </ng-container>

        <ng-template #loadingSlider>
          <p-slider styleClass="ambient-slider" [ngModel]="minTemp" [min]="minTemp" [max]="maxTemp"
            [disabled]="true"></p-slider>
        </ng-template>

        <span class="simulation-value">
          <ng-container *ngIf="hasAmbientTemperature(location); else loadingTemp">
            {{ getDisplayAmbientTemperature(location) }}°F
          </ng-container>

          <ng-template #loadingTemp>Loading...</ng-template>
        </span>
      </div>
    </div>
  </div>

  <!-- Simulation speed controls -->
  <div class="setting-row speed-row">
    <span class="material-symbols-outlined simulation-icon">
      speed
    </span>

    <div class="simulation-control">
      <div class="simulation-header">
        <span class="simulation-label">Simulation Speed:</span>
      </div>

      <div class="speed-button-group">
        <button type="button" *ngFor="let option of speedOptions" class="speed-button"
          [class.selected]="simulationSpeed === option.value" (click)="setSimulationSpeed(option.value)">
          {{ option.label }}
        </button>
      </div>
    </div>
  </div>
</p-card>
