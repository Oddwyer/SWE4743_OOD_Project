<!-- Simulation controls. -->
<p-card styleClass="simulation-card">
  <div class="simulation-card-header">
    <h2>Simulation Settings</h2>
  </div>

  <!-- Ambient temperature controls -->
  <div *ngFor="let location of locations" class="setting-row ambient-row">
    <span class="icon">🌡️</span>

    <div class="simulation-control">
      <div class="simulation-header">
        <span class="simulation-label">{{ location }} Ambient Temperature:</span>

        <span class="simulation-value">
          <ng-container *ngIf="hasAmbientTemperature(location); else loadingTemp">
            {{ getAmbientTemperature(location) }}°F
          </ng-container>

          <ng-template #loadingTemp>
            Loading...
          </ng-template>
        </span>
      </div>

      <p-slider
        styleClass="ambient-slider"
        [ngModel]="hasAmbientTemperature(location) ? getAmbientTemperature(location) : minTemp"
        [min]="minTemp"
        [max]="maxTemp"
        [disabled]="!hasAmbientTemperature(location)"
        (onSlideEnd)="setAmbientTemperature(location, $any($event).value)">
      </p-slider>
    </div>
  </div>

  <!-- Simulation speed controls -->
  <div class="setting-row">
    <i class="pi pi-bolt"></i>

    <div class="simulation-control">
      <div class="simulation-header">
        <span class="simulation-label">Speed:</span>
        <span class="simulation-value">{{ getSimulationSpeedLabel() }}</span>
      </div>
    </div>
  </div>
</p-card>
